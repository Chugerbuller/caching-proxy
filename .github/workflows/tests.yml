name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./... 2>&1 | tee vet.txt

      - name: Test
        run: |
          set -o pipefail
          go test -race -cover ./... 2>&1 | tee test.txt

      - name: Report
        if: always()
        run: |
          {
            echo "## go vet"
            echo '```'
            cat vet.txt 2>/dev/null || true
            echo '```'
            echo "## go test"
            echo '```'
            grep -E -- '--- FAIL|^(ok|FAIL)\s|_test\.go:[0-9]+:|^panic:|\.go:[0-9]+:[0-9]+:' test.txt 2>/dev/null | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
